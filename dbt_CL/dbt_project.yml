name: dbt_CL # Projektname
version: 1.0.0 # Projektversion
config-version: 2 # dbt-Konfigurationsversion

profile: dbt_CL # Verbindung aus profiles.yml

model-paths:
  - models # SQL-Modelle

analysis-paths:
  - analyses # SQL-Analysen

test-paths:
  - tests # Tests

seed-paths:
  - seeds # CSV-Dateien

macro-paths:
  - macros # Wiederverwendbare Funktionen

snapshot-paths:
  - snapshots # Historische Daten

models:
  dbt_CL:
    +materialized: view # Modelle standardmäßig als Views

    marts:
      +materialized: table # Mart-Modelle als Tabellen
